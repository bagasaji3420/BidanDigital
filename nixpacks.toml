[phases.setup]
packages = ["php84", "php84Extensions.mbstring", "php84Extensions.xml", "php84Extensions.bcmath", "php84Extensions.curl", "php84Extensions.zip", "php84Extensions.gd", "php84Extensions.intl", "php84Extensions.pdo", "php84Extensions.pdo_mysql", "php84Extensions.tokenizer", "php84Extensions.ctype", "php84Extensions.fileinfo", "php84Extensions.openssl", "nodejs_22", "composer"]

[phases.install]
cmds = []

[phases.build]
cmds = [
  "composer install --optimize-autoloader --no-dev --no-interaction",
  "npm install",
  "npm run build"
]

[start]
cmd = "php artisan optimize:clear && php artisan migrate --force && php artisan optimize && php artisan serve --host=0.0.0.0 --port=$PORT"